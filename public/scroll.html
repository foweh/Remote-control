<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>滚轮遥控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    background: #0f0f1a;
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  /* 顶部状态条：极简，只占一行 */
  #statusbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: 12px;
    color: #666;
    flex-shrink: 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
  .dot.on { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,.7); }
  #latency { margin-left: auto; color: #818cf8; font-variant-numeric: tabular-nums; }

  /* 上下两个半屏大分区 */
  .zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    transition: background .12s;
  }
  .zone .zinner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 72px;
    font-weight: 700;
    opacity: 0.35;
    transition: all .12s;
  }
  .zone .zsub { font-size: 13px; font-weight: 400; }
  .zone.up   { color: #818cf8; background: rgba(79, 70, 229, 0.05); }
  .zone.down { color: #f87171; background: rgba(239, 68, 68, 0.04); }
  .zone.up.pressed {
    background: rgba(79, 70, 229, 0.35);
    box-shadow: 0 0 60px rgba(79, 70, 229, 0.35) inset;
  }
  .zone.down.pressed {
    background: rgba(239, 68, 68, 0.30);
    box-shadow: 0 0 60px rgba(239, 68, 68, 0.30) inset;
  }
  .zone.pressed .zinner { opacity: 1; transform: scale(1.06); }

  /* 底部速度滑块：小药丸 */
  #speedPill {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(255,255,255,0.04);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 10px 20px 14px;
    font-size: 13px;
    color: #999;
  }
  #speedPill input { width: 170px; accent-color: #4f46e5; }
  #speedVal {
    min-width: 40px;
    text-align: center;
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="statusbar">
    <a href="control.html" style="color:#818cf8;text-decoration:none;flex-shrink:0;">← 触摸板</a>
    <span class="dot" id="dot"></span>
    <span id="status">连接中…</span>
    <span id="latency">--</span>
  </div>

  <div class="zone up" id="zoneUp">
    <div class="zinner">▲<span class="zsub">按住上滚</span></div>
  </div>

  <div class="zone down" id="zoneDown">
    <div class="zinner">▼<span class="zsub">按住下滚</span></div>
  </div>

  <div id="speedPill">
    速度
    <input type="range" id="speed" min="1" max="10" step="1" value="3" />
    <span id="speedVal">3</span>
  </div>

<script>
(function () {
  'use strict';
  var ws = null;
  var speed = 3;
  var active = null; // 'up' | 'down' | null
  var pingTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function send(m) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m));
  }
  function setStatus(ok, text) {
    $('dot').className = 'dot' + (ok ? ' on' : '');
    $('status').textContent = text;
  }

  function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws?page=scroll');
    ws.onopen = function () {
      setStatus(true, '已连接');
      send({ t: 'wset', v: speed }); // 连接后同步当前速度
    };
    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'pong' && typeof m.ts === 'number') {
        $('latency').textContent = Math.max(0, Math.round(performance.now() - m.ts)) + ' ms';
      }
    };
    ws.onclose = function () { setStatus(false, '断开，重连中…'); setTimeout(connect, 2000); };
    ws.onerror = function () {};
  }

  function startPing() {
    pingTimer = setInterval(function () {
      send({ t: 'ping', ts: performance.now() });
    }, 2000);
  }

  // ---------- 上半屏 = 上滚，下半屏 = 下滚；按住即滚，手指滑到另一半自动换向 ----------
  function zoneOf(t) {
    var r = $('zoneUp').getBoundingClientRect();
    return t.clientY <= r.bottom ? 'up' : 'down';
  }

  function press(dir) {
    if (active === dir) return;
    if (active) $('zone' + active[0].toUpperCase() + active.slice(1)).classList.remove('pressed');
    active = dir;
    $('zone' + dir[0].toUpperCase() + dir.slice(1)).classList.add('pressed');
    send({ t: 'scrollStart', dir: dir }); // 按下即滚一格（服务端立即反馈），已激活时服务端直接换向
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }

  function release() {
    if (!active) return;
    var dir = active;
    active = null;
    $('zone' + dir[0].toUpperCase() + dir.slice(1)).classList.remove('pressed');
    send({ t: 'scrollStop' });
  }

  function bindZone(zone, dir) {
    zone.addEventListener('touchstart', function (e) { e.preventDefault(); press(dir); }, { passive: false });
    zone.addEventListener('mousedown', function (e) { e.preventDefault(); press(dir); });
    zone.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  bindZone($('zoneUp'), 'up');
  bindZone($('zoneDown'), 'down');

  // 按住时手指滑到另一半 → 自动切换方向
  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!active || e.touches.length === 0) return;
    var d = zoneOf(e.touches[0]);
    if (d !== active) press(d);
  }, { passive: false });

  document.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) { release(); return; }
    // 还有手指按着：以剩余手指所在半屏为准，自动纠正方向
    var d = zoneOf(e.touches[0]);
    if (active && d !== active) press(d);
  });
  document.addEventListener('touchcancel', function () { release(); });
  document.addEventListener('mouseup', function () { release(); });

  // 页面切后台/锁屏 = 强制停止，防止一直滚
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) release();
  });

  // ---------- 速度滑块（1-10，手机上实时可调） ----------
  $('speed').oninput = function () {
    speed = parseInt(this.value, 10);
    $('speedVal').textContent = speed;
    send({ t: 'wset', v: speed });
  };

  connect();
  startPing();
})();
</script>
</body>
</html>
