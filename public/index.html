<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mouse-ctrl-v3 · 手机控制电脑鼠标</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0f0f1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  h1 .ver { font-size: 12px; color: #666; font-weight: 400; margin-left: 6px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 24px; text-align: center; line-height: 1.7; }
  .warn {
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.35);
    color: #f87171;
    border-radius: 14px;
    padding: 10px 20px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
    text-align: center;
    line-height: 1.7;
  }

  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px;
    width: 320px;
    text-align: center;
    transition: border-color .2s;
  }
  .card:hover { border-color: rgba(79,70,229,0.5); }
  .card h2 { font-size: 18px; margin-bottom: 4px; }
  .card .desc { color: #999; font-size: 13px; margin-bottom: 16px; }
  .qr-box {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    display: inline-block;
    line-height: 0;
  }
  .qr-target {
    font-size: 15px;
    font-weight: 600;
    color: #4ade80;
    margin-bottom: 14px;
    word-break: break-all;
    user-select: all;
  }
  .qr-box canvas, .qr-box img { border-radius: 4px; }
  .url-text {
    margin-top: 14px;
    font-size: 12px;
    color: #818cf8;
    word-break: break-all;
    user-select: all;
    display: block;
    text-decoration: none;
  }
  .scan-hint {
    margin-top: 8px;
    font-size: 12px;
    color: #777;
    line-height: 1.7;
  }

  .ip-bar { margin-top: 28px; text-align: center; }
  .ip-bar .label { color: #aaa; font-size: 13px; margin-bottom: 10px; }
  .ip-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc;
    padding: 7px 16px;
    margin: 4px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  .ip-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .ip-btn.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }

  .status { margin-top: 24px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .chip {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 13px;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,.7); }
  .dot.warn { background: #f87171; }
</style>
</head>
<body>
  <h1>🖱️ 手机控制电脑鼠标 <span class="ver">v3.2</span></h1>
  <div class="sub">
    手机和电脑连同一个 WiFi，用手机扫下面的二维码即可直接打开控制页<br />
    二维码地址为本机真实局域网 IP，随 WiFi 自动更新
  </div>

  <div class="warn" id="warnNoLan">⚠️ 未检测到可用的局域网 IP（电脑没连 WiFi？），手机将无法访问。请连接 WiFi 后刷新本页。</div>

  <div class="cards">
    <div class="card">
      <h2>🎮 手机控制页</h2>
      <div class="desc">扫这个码 = 手机直接打开控制页：触摸板 / 滚轮遥控 / 键盘输入</div>
      <div class="qr-target" id="qrTarget"></div>
      <div class="qr-box"><div id="qrControl"></div></div>
      <a class="url-text" id="urlControl" target="_blank" rel="noopener"></a>
      <div class="scan-hint">用手机自带相机扫码可直接打开网页；<br />若用微信扫码显示为文本：长按复制 → 粘贴到手机浏览器打开</div>
      <div class="scan-hint" style="margin-top:2px;">只想用滚轮遥控？控制页右上角有「滚轮」入口；或直接访问 <a id="urlScroll" target="_blank" rel="noopener"></a></div>
    </div>
  </div>

  <div class="ip-bar">
    <div class="label">二维码使用的局域网地址（多网卡时手动切换）</div>
    <div id="ipButtons"></div>
  </div>

  <div class="status">
    <div class="chip"><span class="dot" id="dotSrv"></span><span id="txtSrv">服务器状态</span></div>
    <div class="chip"><span class="dot" id="dotDriver"></span><span id="txtDriver">鼠标驱动</span></div>
    <div class="chip">📱 已连接手机：<span id="txtPhones">0</span></div>
    <div class="chip" id="phonePages" style="display:none"></div>
  </div>

  <script src="qrcode.min.js"></script>
  <script>
  (function () {
    'use strict';
    var port = 8642;
    var ips = [];
    var currentIp = null;
    var qrControl = null;
    var ws = null;

    var $ = function (id) { return document.getElementById(id); };

    // 手机浏览器访问本页 -> 直接跳到控制页（手机上永远不显示二维码页）
    if (/Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent) ||
        ('ontouchstart' in window && Math.min(screen.width, screen.height) < 768)) {
      location.replace('/control.html');
      return;
    }

    function isLanIp(s) {
      return typeof s === 'string' && /^\d{1,3}(\.\d{1,3}){3}$/.test(s) &&
             s.indexOf('169.254.') !== 0 && s !== '127.0.0.1';
    }

    function showWarn(msg) {
      var w = $('warnNoLan');
      w.textContent = '⚠️ ' + msg;
      w.style.display = 'block';
    }

    function makeQR(url, allowLocalhost) {
      // 硬校验：不是合法 http 地址，绝不生成二维码（任何异常输入都只会报警，不会崩溃）
      var m = (typeof url === 'string') ? url.match(/^http:\/\/([^:\/]+)/) : null;
      var host = m ? m[1] : '';
      var hostOk = isLanIp(host) || (allowLocalhost && host === 'localhost');
      if (!m || !hostOk) {
        showWarn('无法确定本机地址，未生成二维码。请检查网络后刷新本页。');
        return;
      }
      var u1 = url + '/control.html', u2 = url + '/scroll.html';
      $('qrTarget').textContent = '扫码将打开：' + u1;
      $('urlControl').textContent = u1; $('urlControl').href = u1;
      $('urlScroll').textContent = u2;  $('urlScroll').href = u2;
      if (!qrControl) return;
      qrControl.clear();
      qrControl.makeCode(u1);
    }

    function selectIp(ip) {
      currentIp = ip;
      try { localStorage.setItem('mousectrl_ip', ip); } catch (e) {}
      var btns = document.querySelectorAll('.ip-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].textContent === ip);
      }
      makeQR('http://' + ip + ':' + port, ip === 'localhost');
    }

    function renderIpButtons() {
      var box = $('ipButtons');
      box.innerHTML = '';
      var list = ips.filter(isLanIp);
      if (list.indexOf('localhost') < 0) list.push('localhost');
      for (var i = 0; i < list.length; i++) {
        (function (ip) {
          var b = document.createElement('button');
          b.className = 'ip-btn';
          b.textContent = ip;
          b.onclick = function () { selectIp(ip); };
          box.appendChild(b);
        })(list[i]);
      }
    }

    function connectWS() {
      ws = new WebSocket('ws://' + location.host + '/ws?page=index');
      ws.onopen = function () {
        setDot('dotSrv', 'on');
        $('txtSrv').textContent = '服务器在线';
      };
      ws.onmessage = function (ev) {
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'clients') {
          $('txtPhones').textContent = m.n;
          var chip = $('phonePages');
          if (m.n > 0) {
            var pages = [];
            for (var i = 0; i < m.phones.length; i++) {
              pages.push(m.phones[i].page === 'scroll' ? '🔼🔽滚轮' : '🎮触摸板');
            }
            chip.textContent = '正在控制：' + pages.join('、');
            chip.style.display = '';
          } else {
            chip.style.display = 'none';
          }
        } else if (m.t === 'driverReady') {
          setDot('dotDriver', 'on');
          $('txtDriver').textContent = '驱动就绪';
        }
      };
      ws.onclose = function () {
        setDot('dotSrv', 'warn');
        $('txtSrv').textContent = '连接断开，重连中…';
        setTimeout(connectWS, 2000);
      };
      ws.onerror = function () {};
    }

    function setDot(id, cls) {
      var d = $(id);
      d.className = 'dot ' + cls;
    }

    fetch('/info').then(function (r) { return r.json(); }).then(function (info) {
      port = (typeof info.port === 'number') ? info.port : 8642;
      ips = Array.isArray(info.ips) ? info.ips : [];
      renderIpButtons();

      var defaultUrl = null;
      var host = location.hostname;
      if (isLanIp(host)) {
        // 页面通过局域网 IP 打开 → 二维码就用这个地址（页面能打开，扫码必然可达）
        defaultUrl = 'http://' + host + ':' + port;
      } else {
        // 通过 localhost 打开 → 从网卡列表选真实局域网 IP
        var usable = ips.filter(isLanIp);
        var saved = null;
        try { saved = localStorage.getItem('mousectrl_ip'); } catch (e) {}
        var pick = (saved && usable.indexOf(saved) >= 0) ? saved : (usable[0] || null);
        if (pick) defaultUrl = 'http://' + pick + ':' + port;
      }

      if (defaultUrl) {
        qrControl = new QRCode($('qrControl'), { width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
        makeQR(defaultUrl);
        var activeHost = defaultUrl.replace(/^http:\/\//, '').split(':')[0];
        var btns = document.querySelectorAll('.ip-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle('active', btns[i].textContent === activeHost);
        }
        try { localStorage.setItem('mousectrl_ip', activeHost); } catch (e) {}
      } else {
        showWarn('未检测到局域网 IP（电脑没连 WiFi？），无法生成二维码。请连接 WiFi 后刷新本页。');
      }
      connectWS();
    }).catch(function () {
      showWarn('获取本机信息失败，请刷新页面重试。');
    });
  })();
  </script>
</body>
</html>
